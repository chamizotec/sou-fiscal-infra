name: sou-fiscal

services:
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/soufiscal-local
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 25s

  back:
    image: sou-fiscal-back
    build:
      context: ../back
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: soufiscal-local
      TSE_DIR: /dados/arquivos-tse
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - ../../arquivos-tse:/dados/arquivos-tse:ro
    depends_on:
      neo4j:
        condition: service_healthy

  web:
    image: sou-fiscal-web
    build:
      context: ../web
    ports:
      - "3000:3000"
    depends_on:
      - back

  import:
    image: sou-fiscal-import
    build:
      context: ../import
    profiles: ["import"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: soufiscal-local
      TSE_DIR: /dados/arquivos-tse
      RECEITA_DIR: /dados/arquivos-receita
    volumes:
      - ../../arquivos-tse:/dados/arquivos-tse:ro
      - ../../arquivos-receita:/dados/arquivos-receita:ro
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
